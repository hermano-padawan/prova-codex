<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tabla periódica interactiva</title>
    <style>
      :root {
        --bg: #ffeb3b;
        --bg-strong: #ffea00;
        --card: #1e293b;
        --text: #111827;
        --accent: #38bdf8;
      }

      * {
        box-sizing: border-box;
      }


      html,
      body,
      .app {
        background-color: var(--bg-strong) !important;
      }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: var(--bg-strong) !important;
        color: var(--text);
        width: 100vw;
        height: 100vh;
        overflow: hidden;
      }

      .app {
        height: 100vh;
        display: grid;
        grid-template-rows: auto auto 1fr auto;
        gap: 0.5rem;
        padding: 0.6rem;
      }

      h1 {
        margin: 0;
        text-align: center;
        font-size: clamp(1rem, 2vw, 1.6rem);
      }

      .subtitle {
        margin: 0;
        text-align: center;
        font-size: clamp(0.65rem, 1.1vw, 0.9rem);
        opacity: 0.9;
      }

      .table {
        border: 2px solid #f59e0b;
        border-radius: 0.4rem;
        background: rgba(255, 255, 255, 0.2);
        display: grid;
        grid-template-columns: repeat(18, minmax(0, 1fr));
        grid-template-rows: repeat(10, minmax(0, 1fr));
        gap: 0.22rem;
        min-height: 0;
      }

      .element {
        background: rgba(30, 41, 59, 0.95);
        border: 1px solid #334155;
        border-radius: 0.35rem;
        display: grid;
        grid-template-rows: auto 1fr auto;
        padding: 0.14rem;
        min-height: 0;
      }

      .num {
        font-size: clamp(0.34rem, 0.56vw, 0.56rem);
        opacity: 0.85;
      }

      .symbol,
      .speak {
        border: none;
        cursor: pointer;
        border-radius: 0.23rem;
      }

      .symbol {
        width: 100%;
        background: transparent;
        color: #f8fafc;
        font-weight: 700;
        font-size: clamp(0.44rem, 0.86vw, 0.98rem);
        line-height: 1;
        padding: 0.08rem 0;
      }

      .name {
        font-size: clamp(0.32rem, 0.5vw, 0.56rem);
        text-align: center;
        opacity: 0.9;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .speak {
        justify-self: center;
        background: #334155;
        color: #e2e8f0;
        font-size: clamp(0.34rem, 0.5vw, 0.56rem);
        padding: 0.03rem 0.2rem;
      }

      .symbol:hover,
      .symbol:focus,
      .speak:hover,
      .speak:focus {
        outline: 1px solid var(--accent);
        background: rgba(56, 189, 248, 0.16);
      }

      .footer {
        text-align: center;
        font-size: clamp(0.54rem, 0.84vw, 0.76rem);
        opacity: 0.86;
      }
    </style>
  </head>
  <body>
    <main class="app">
      <h1>Tabla periódica interactiva</h1>
      <p class="subtitle">
        Pulsa las siglas o el botón ▶ para escuchar el nombre del elemento.
      </p>
      <section id="tabla" class="table" aria-label="Tabla periódica"></section>
      <div class="footer">Diseño de una sola página sin scroll para uso en clase.</div>

      const tabla = document.getElementById("tabla");

      function reproducirElemento(nombre, simbolo) {
        if (!window.speechSynthesis) {
          alert("Tu navegador no soporta síntesis de voz.");
          return;
        }

        window.speechSynthesis.cancel();
        const voz = new SpeechSynthesisUtterance(`${simbolo}, ${nombre}`);
        voz.lang = "es-ES";
        voz.rate = 0.92;
        voz.pitch = 1;
        window.speechSynthesis.speak(voz);
      }

      function crearElemento(el) {
        const card = document.createElement("article");
        card.className = "element";
        card.style.gridColumn = el.g;
        card.style.gridRow = el.p;

        card.innerHTML = `
          <span class="num">${el.n}</span>
          <button class="symbol" type="button" aria-label="Escuchar ${el.name}">${el.s}</button>
          <div class="name">${el.name}</div>
          <button class="speak" type="button" aria-label="Reproducir ${el.name}">▶</button>
        `;

        const symbolBtn = card.querySelector(".symbol");
        const playBtn = card.querySelector(".speak");
        const action = () => reproducirElemento(el.name, el.s);

        symbolBtn.addEventListener("click", action);
        playBtn.addEventListener("click", action);

        return card;
      }

      elementos.forEach((el) => tabla.appendChild(crearElemento(el)));
